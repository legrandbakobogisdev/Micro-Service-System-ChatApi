services:
  # ===================================================
  # DATABASES
  # ===================================================

  # MongoDB - auth
  mongodb-auth:
    image: mongo:7
    container_name: chatapp-mongodb-auth
    profiles: [ "isolated" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: marketplace_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD_AUTH:-changeme}
    ports:
      - "27018:27017"
    volumes:
      - mongodb-auth-data:/data/db
      - mongodb-auth-config:/data/configdb
    networks:
      - marketplace-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB - subscription
  mongodb-subscription:
    image: mongo:7
    container_name: chatapp-mongodb-subscription
    profiles: [ "isolated" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: marketplace_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD_SUBSCRIPTION:-changeme}
    ports:
      - "27020:27017"
    volumes:
      - mongodb-subscription-data:/data/db
      - mongodb-subscription-config:/data/configdb
    networks:
      - marketplace-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB - payment
  mongodb-payment:
    image: mongo:7
    container_name: chatapp-mongodb-payment
    profiles: [ "isolated" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: marketplace_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD_PAYMENT:-changeme}
    ports:
      - "27021:27017"
    volumes:
      - mongodb-payment-data:/data/db
      - mongodb-payment-config:/data/configdb
    networks:
      - marketplace-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB - notification
  mongodb-notification:
    image: mongo:7
    container_name: chatapp-mongodb-notification
    profiles: [ "isolated" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: marketplace_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD_NOTIFICATION:-changeme}
    ports:
      - "27024:27017"
    volumes:
      - mongodb-notification-data:/data/db
      - mongodb-notification-config:/data/configdb
    networks:
      - marketplace-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB - analytics
  mongodb-analytics:
    image: mongo:7
    container_name: chatapp-mongodb-analytics
    profiles: [ "isolated" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: marketplace_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD_ANALYTICS:-changeme}
    ports:
      - "27025:27017"
    volumes:
      - mongodb-analytics-data:/data/db
      - mongodb-analytics-config:/data/configdb
    networks:
      - marketplace-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB - support
  mongodb-support:
    image: mongo:7
    container_name: chatapp-mongodb-support
    profiles: [ "isolated" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: marketplace_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD_SUPPORT:-changeme}
    ports:
      - "27026:27017"
    volumes:
      - mongodb-support-data:/data/db
      - mongodb-support-config:/data/configdb
    networks:
      - marketplace-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB - media
  mongodb-media:
    image: mongo:7
    container_name: chatapp-mongodb-media
    profiles: [ "isolated" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: marketplace_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD_MEDIA:-changeme}
    ports:
      - "27027:27017"
    volumes:
      - mongodb-media-data:/data/db
      - mongodb-media-config:/data/configdb
    networks:
      - marketplace-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB - chat
  mongodb-chat:
    image: mongo:7
    container_name: chatapp-mongodb-chat
    profiles: [ "isolated" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: marketplace_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD_CHAT:-changeme}
    ports:
      - "27028:27017"
    volumes:
      - mongodb-chat-data:/data/db
      - mongodb-chat-config:/data/configdb
    networks:
      - marketplace-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis - Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: chatapp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Zookeeper - Kafka dependency
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: chatapp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kafka - Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: chatapp-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093" ]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ===================================================
  # MICROSERVICES
  # ===================================================

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: chatapp-auth-service
    ports:
      - "3001:3001"
    env_file:
      - services/auth-service/.env
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); });" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  subscription-service:
    build:
      context: .
      dockerfile: services/subscription-service/Dockerfile
    container_name: chatapp-subscription-service
    ports:
      - "3003:3003"
    env_file:
      - services/subscription-service/.env
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); });" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: chatapp-payment-service
    ports:
      - "3004:3004"
    env_file:
      - services/payment-service/.env
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3004/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); });" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: chatapp-notification-service
    ports:
      - "3008:3008"
    env_file:
      - services/notification-service/.env
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3008/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); });" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: chatapp-analytics-service
    ports:
      - "3009:3009"
    env_file:
      - services/analytics-service/.env
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3009/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); });" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  support-service:
    build:
      context: .
      dockerfile: services/support-service/Dockerfile
    container_name: chatapp-support-service
    ports:
      - "3010:3010"
    env_file:
      - services/support-service/.env
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); });" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  media-service:
    build:
      context: .
      dockerfile: services/media-service/Dockerfile
    container_name: chatapp-media-service
    ports:
      - "3011:3011"
    env_file:
      - services/media-service/.env
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3011/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); });" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    container_name: chatapp-chat-service
    ports:
      - "3012:3012"
    env_file:
      - services/chat-service/.env
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3012/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); });" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: chatapp-api-gateway
    ports:
      - "8000:8000"
    env_file:
      - services/api-gateway/.env
    depends_on:
      - auth-service
      - subscription-service
      - payment-service
      - notification-service
      - analytics-service
      - support-service
      - media-service
      - chat-service
    networks:
      - marketplace-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); });" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: chatapp-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - marketplace-network
    restart: unless-stopped

# ===================================================
# NETWORKS
# ===================================================
networks:
  marketplace-network:
    driver: bridge

# ===================================================
# VOLUMES
# ===================================================
volumes:
  mongodb-auth-data:
  mongodb-auth-config:
  mongodb-subscription-data:
  mongodb-subscription-config:
  mongodb-payment-data:
  mongodb-payment-config:
  mongodb-notification-data:
  mongodb-notification-config:
  mongodb-analytics-data:
  mongodb-analytics-config:
  mongodb-support-data:
  mongodb-support-config:
  mongodb-media-data:
  mongodb-media-config:
  mongodb-chat-data:
  mongodb-chat-config:
  redis-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
